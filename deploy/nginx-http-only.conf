# HTTP-only nginx site for the certbot bootstrap dance.
# bootstrap.sh installs this as /etc/nginx/sites-available/relay BEFORE
# running certbot. After certbot has provisioned certs, bootstrap swaps
# the full nginx.conf in (which references the now-existing TLS files).

server {
    listen 80;
    listen [::]:80;
    server_name relayed.live;

    # ACME challenge for certbot's HTTP-01 verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Holding-page response while certs are being issued (visible only
    # in the seconds between bootstrap finishing and certbot acquiring
    # the cert + nginx getting the full config). Useful so curl + browser
    # don't get a confusing connection-reset.
    location / {
        return 503 "TLS provisioning in progress\n";
        add_header Content-Type text/plain;
    }
}

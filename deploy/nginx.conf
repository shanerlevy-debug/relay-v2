# /etc/nginx/sites-available/relay — installed by bootstrap.sh.
# nginx terminates TLS, routes /api/* to FastAPI (port 8000) and
# everything else to Next.js (port 3006).

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name relayed.live;

    # ACME challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main entry point
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name relayed.live;

    # Certbot fills these in on `certbot --nginx -d relayed.live`
    ssl_certificate /etc/letsencrypt/live/relayed.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relayed.live/privkey.pem;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reasonable upload + timeout defaults
    client_max_body_size 8m;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_connect_timeout 10s;

    # Forward real client info to the apps
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # API — FastAPI on 127.0.0.1:8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # UI — Next.js on 127.0.0.1:3006
    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

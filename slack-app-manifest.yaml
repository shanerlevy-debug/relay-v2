# Slack App manifest for the production Relay app at relayed.live.
# Paste this at https://api.slack.com/apps -> Create New App -> From a manifest.
#
# Per-deployment knobs to flip BEFORE pasting:
#   - display_information.name: keep "Relay" or rebrand per your tenant
#   - features.slash_commands.command: must match RELAY_SLACK_SLASH_COMMAND
#   - settings.event_subscriptions.request_url: NOT used in Socket Mode
#   - oauth_config.redirect_urls: must point at your API public URL
#
# After paste:
#   1. Basic Information -> App-Level Tokens -> generate one with
#      connections:write scope (= RELAY_SLACK_APP_TOKEN, xapp-...)
#   2. OAuth & Permissions -> redirect URLs already point at
#      https://relayed.live/api/oauth/slack/callback (from the manifest)
#   3. Distribution -> "Distribute App" if going public, or stay in
#      development mode for invite-only tenants
#   4. App Home -> enable "Messages tab" + uncheck "messages_tab_read_only"
#      if you want DMs (manifest sets this but Slack sometimes doesn't apply
#      it via the manifest API)
#   5. Drop your client_id + client_secret into the API's .env as
#      OAUTH_SLACK_CLIENT_ID and OAUTH_SLACK_CLIENT_SECRET.

display_information:
  name: Relay
  description: Multi-tenant Claude bridge — relayed.live
  background_color: "#1a1a1a"

features:
  bot_user:
    display_name: Relay
    always_online: true

  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false

  slash_commands:
    - command: /ask
      description: Ask one of the agents
      usage_hint: "<agent-slug> <message>"
      should_escape: false

oauth_config:
  redirect_urls:
    - https://relayed.live/api/oauth/slack/callback
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - chat:write.public
      - channels:history
      - im:history
      - im:write
      - commands

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.im

  interactivity:
    is_enabled: true

  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false

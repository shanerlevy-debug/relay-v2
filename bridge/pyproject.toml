[project]
name = "relay-bridge"
version = "0.1.0"
description = "Relay multi-tenant Slack <-> Claude Managed Agents bridge process"
requires-python = ">=3.12"

# Most deps come transitively from relay-api (anthropic, sqlalchemy,
# psycopg, structlog, cryptography, python-dotenv). Install order:
#   pip install -e ../api
#   pip install -e .
# slack-bolt is bridge-only — the API doesn't need it.
dependencies = [
    "slack-bolt>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "dbtest: tests that require a live Postgres (skipped with -m 'not dbtest')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B"]
ignore = ["E501"]
